name: Bug report
description: Tell us about something that does not work.
labels: ["bug"]
body:
  - type: input
    id: item
    attributes:
      label: Item
      description: The item or package, for example phone or @vinena/vectoys-cli.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The package version you use.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: How to make the bug happen.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What you thought would happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happened instead.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      description: Browser and version, for example Safari 19.
