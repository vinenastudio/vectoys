name: Release

# Publishes @vinena/vectoys, @vinena/vectoys-react and @vinena/vectoys-cli to npm through
# trusted publishing (OIDC): no npm token, and npm adds provenance on its own. Push a tag like
# `vectoys@0.3.0` that matches the version in all three packages. npm binds trusted publishing
# to this file name, so keep it `release.yml`. Provenance attests this whole workflow; the
# build/publish split only keeps the publish token away from build and dependency code.

on:
  push:
    tags: ['vectoys@*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Builds, tests and packs with no id-token, so install scripts and build tools
  # can never mint an npm publish token.
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main."
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Check tag matches package versions
        id: version
        run: |
          tag="${GITHUB_REF_NAME#vectoys@}"
          for dir in engine react cli; do
            version="$(node -p "require('./packages/$dir/package.json').version")"
            if [ "$tag" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match packages/$dir/package.json version $version."
              exit 1
            fi
          done
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun test
      # `npm publish` ships `workspace:^` as is, and `bun publish` has no trusted publishing.
      # So bun packs each package (that rewrites workspace ranges to real versions) and the
      # publish job hands the tarballs to npm.
      - name: Pack
        run: |
          for dir in engine react cli; do
            (cd "packages/$dir" && bun pm pack --destination "$RUNNER_TEMP/pack" --quiet)
          done
      - name: Check react depends on this engine version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          range="$(tar -xOzf "$RUNNER_TEMP/pack/vinena-vectoys-react-$VERSION.tgz" package/package.json | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0, 'utf8')).dependencies['@vinena/vectoys'])")"
          if [ "$range" != "^$VERSION" ]; then
            echo "::error::vectoys-react depends on @vinena/vectoys $range, not ^$VERSION. bun.lock still records an old engine version; set the same version on the packages/engine, packages/react and packages/cli entries in bun.lock (plain \`bun install\` does not update them) and commit bun.lock with the bump."
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/pack
          retention-days: 1
          if-no-files-found: error

  # Its own job with only first-party actions, so only this job can mint an npm token.
  publish:
    needs: build
    # npm trusted publishing does not support self-hosted runners.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # Trusted publishing needs npm 11.5.1 or later. Node 24 bundles it (v24.22.2 ships
      # npm 11.19.1). No npm self-upgrade here, so no registry code runs next to the id-token.
      - name: Check npm version
        run: |
          version="$(npm --version)"
          if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$version"; then
            echo "::error::npm $version is older than 11.5.1, which trusted publishing needs."
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tarballs
          path: ${{ runner.temp }}/pack
      # Publishing a tarball runs no lifecycle scripts. Order matters: react depends on the engine.
      - name: Publish to npm
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag_args=()
          case "$VERSION" in
            *-*) tag_args=(--tag next) ;;
          esac
          for pkg in vinena/vectoys:vinena-vectoys vinena/vectoys-react:vinena-vectoys-react vinena/vectoys-cli:vinena-vectoys-cli; do
            name="@${pkg%%:*}"
            tarball="$RUNNER_TEMP/pack/${pkg#*:}-$VERSION.tgz"
            if [ ! -f "$tarball" ]; then
              echo "::error::Missing tarball $tarball for $name."
              exit 1
            fi
            published="$(npm view "$name@$VERSION" version 2>/dev/null || true)"
            if [ "$published" = "$VERSION" ]; then
              echo "::notice::$name@$VERSION is already on npm. Skipping publish."
              continue
            fi
            npm publish "$tarball" --access public "${tag_args[@]}"
          done
