name: Release

# Publishes @vinena/vectoys, @vinena/vectoys-react and @vinena/vectoys-cli to npm through
# trusted publishing (OIDC): no npm token, and npm adds provenance on its own. Push a tag like
# `vectoys@0.3.0` that matches the version in all three packages. npm binds trusted publishing
# to this file name, so keep it `release.yml`.

on:
  push:
    tags: ['vectoys@*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-vectoys
  cancel-in-progress: false

jobs:
  publish:
    # npm trusted publishing does not support self-hosted runners.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # Trusted publishing needs npm 11.5.1 or later.
      - name: Check npm version
        run: |
          if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"; then
            npm install -g npm@^11.5.1
          fi
          npm --version
      - name: Check tag matches package versions
        id: version
        run: |
          tag="${GITHUB_REF_NAME#vectoys@}"
          for dir in engine react cli; do
            version="$(node -p "require('./packages/$dir/package.json').version")"
            if [ "$tag" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match packages/$dir/package.json version $version."
              exit 1
            fi
          done
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun test
      # `npm publish` ships `workspace:^` as is, and `bun publish` has no trusted publishing.
      # So bun packs each package (that rewrites workspace ranges to real versions) and npm
      # publishes the tarball. Publishing a tarball runs no lifecycle scripts, so dist comes
      # from the build step above. Order matters: react depends on the engine.
      - name: Publish to npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag_args=()
          case "$VERSION" in
            *-*) tag_args=(--tag next) ;;
          esac
          out="$RUNNER_TEMP/pack"
          mkdir -p "$out"
          for dir in engine react cli; do
            name="$(node -p "require('./packages/$dir/package.json').name")"
            published="$(npm view "$name@$VERSION" version 2>/dev/null || true)"
            if [ "$published" = "$VERSION" ]; then
              echo "::notice::$name@$VERSION is already on npm. Skipping publish."
              continue
            fi
            tarball="$(cd "packages/$dir" && bun pm pack --destination "$out" --quiet | tail -n 1)"
            npm publish "$tarball" --access public "${tag_args[@]}"
          done
