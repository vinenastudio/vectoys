name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun test
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    env:
      VECTOYS_VISUAL_IN_CONTAINER: "1"
    steps:
      # The merge commit and its first parent, the base branch, to tell which items the pull request adds.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 2 }
      - run: npm install --global bun@1.3.14
      - run: bun install --frozen-lockfile
      # visual-note.yml reads the artifact this writes and puts a neutral check and a comment on the pull request.
      - id: new
        name: Find the new items that need a maintainer baseline
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          items=$(bun apps/site/visual/baselines-ci.ts new HEAD^1)
          echo "items=$items" >> "$GITHUB_OUTPUT"
          needed=$(VECTOYS_NEW_ITEMS=$items bun apps/site/visual/baselines-ci.ts needed visual-baselines-needed.json)
          if [ -n "$needed" ]; then
            echo "::notice title=visual: needs maintainer baseline::No snapshots yet for: $needed. A maintainer runs bun run test:visual:update and commits them."
            # shellcheck disable=SC2016 # the backticks are Markdown
            printf '### visual: needs maintainer baseline\n\nThe visual check skips these new items, which have no snapshots yet: %s.\nA maintainer runs `bun run test:visual:update` (it needs Docker) and commits `apps/site/visual/snapshots/*/<name>.png`.\n' "$needed" >> "$GITHUB_STEP_SUMMARY"
          fi
      # A new item with no snapshots is skipped; every item on the base branch is checked.
      - run: bun run test:visual
        env:
          VECTOYS_NEW_ITEMS: ${{ steps.new.outputs.items }}
      - if: always() && hashFiles('visual-baselines-needed.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-baselines-needed
          path: visual-baselines-needed.json
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-report
          path: apps/site/visual/report
